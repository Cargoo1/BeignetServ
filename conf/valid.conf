server {
	listen					0.0.0.0;
	server_name				localhost;
	error_page				404 /bad_file.txt;
	error_page				400 /bad_file.txt;
	error_page				403 /errors/403.html;
	error_page				413 /errors/413.html;
	error_page				500 502 503 504 /errors/50x.html;
	client_max_body_size	50;
	root		/var/www/html/;

	location / {
		methods		GET;
		index		index.html;
		autoindex	on;
	}

	location /autoindex {
		methods		GET;
		autoindex	on;
	}

	location /tester {
		methods			POST GET DELETE;
		root			/tester/;
		upload_store	/tester;
		index			good_file.txt;
		cgi				.py /usr/bin/python3;
		cgi				.js /usr/bin/node;
		index_cgi		tester_cgi_cpp;
	}

	location /uploads {
		methods					POST DELETE GET;
		index					index.html;
		root					/var/www/html/uploads;
		upload_store			/var/www/html/uploads;
		client_max_body_size	1g;
	}

	location /counter {
		methods	GET;
		root		/var/www/html/counter/;
		index	index.html;
	}

	location /post_body {
		methods					POST;
		client_max_body_size	1k;
		upload_store			/YoupiBanane;
	}

	location /cgi-bin {
		methods	POST GET;
		root					/var/www/html/cgi-bin/;
		index					index.html;
		upload_store			/var/www/html/cgi-bin/;
		client_max_body_size	1k;
		cgi						.py /usr/bin/python3;
		cgi						.php /usr/bin/php-cgi;
	}

	# TEST : ceci est un commentaire ################# Fin de commentaire
	location /old-page {
		methods GET;
		return	301 /new-page;
	}
}

server {
	listen		9090;
	server_name	localhost;
	root		/var/www/site2;

	location / {
		methods		GET;
		root		/var/www/site2;
		index		index.html;
	}
}

server {
	listen		8081;
	server_name	localhost;
	root		/var/www/site2;

	location / {
		methods GET;
		autoindex	on;
	}

# /homepage/lol.txt -> ./var/www/site2///
	location /homepage {
		methods		GET;
		root		/var/www/site2/;
		index		index.html;
	}
}
